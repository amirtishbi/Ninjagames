#req{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-160%);z-index:30;background:#f3e7cd;color:#3a2416;border:3px solid #3a2416;border-radius:14px;box-shadow:0 5px 0 #3a2416;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;transition:transform .3s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
#req.on{transform:translate(-50%,0)}#req{flex-wrap:wrap;justify-content:center;width:max-content}#req span{white-space:nowrap}#req img{height:40px}#req button{font:800 14px Rubik,system-ui;padding:8px 14px;border:2.5px solid #3a2416;border-radius:10px;box-shadow:0 3px 0 #3a2416;background:#8e2c3e;color:#f3e7cd}#req button.sec{background:#fff8e8;color:#3a2416}
@media (orientation:portrait){.h-body{flex-direction:column}.h-char{flex:none}.h-stage img,.h-stage .q{height:96px;line-height:96px}}
#devp .crowd{margin:8px 0;padding:8px;border:1px solid rgba(255,255,255,.2);border-radius:10px}#devp .crowd span{float:left;font-size:12px;opacity:.8}
.fsh{background:#fff8e8;border:2px dashed #3a2416;border-radius:10px;padding:7px 10px;font-size:13px;margin:6px 0;text-align:center}
/* HUD קומפקטי */
#st{display:none!important}#hudL{padding:2px 12px!important;min-width:0!important}#score{font-size:16px!important}
.btn span:not(.cdn){display:none}
#ab1,#ab2{width:52px!important;height:52px!important;right:calc(env(safe-area-inset-right) + 118px)!important}
#ab1{bottom:calc(env(safe-area-inset-bottom) + 30px)!important}#ab2{bottom:calc(env(safe-area-inset-bottom) + 120px)!important;right:calc(env(safe-area-inset-right) + 34px)!important}
#ab1 svg,#ab2 svg{width:24px;height:24px;margin:0 auto}
#act{width:80px!important;height:80px!important}#act svg{width:36px;height:36px;margin:0 auto}
#snd{width:34px!important;height:34px!important;top:auto!important;bottom:calc(env(safe-area-inset-bottom) + 190px)!important;left:calc(env(safe-area-inset-left) + 16px)!important;opacity:.75}#snd svg{width:18px;height:18px}
#quit{position:fixed;width:34px!important;height:34px!important;padding:0;bottom:calc(env(safe-area-inset-bottom) + 190px);left:calc(env(safe-area-inset-left) + 60px);opacity:.75;z-index:6}#quit svg{width:17px;height:17px}
#devb{top:auto!important;bottom:calc(env(safe-area-inset-bottom) + 232px)!important;width:40px!important;height:40px!important}#devb span{display:none}
#crowdc{position:fixed;z-index:4;top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:#f3e7cd;border:2.5px solid #3a2416;border-radius:16px;padding:2px 6px;box-shadow:0 3px 0 #3a2416}
#crowdc button{width:30px;height:28px;border-radius:10px;border:2px solid #3a2416;background:#fff8e8;font:800 18px Rubik,system-ui;color:#3a2416;padding:0;line-height:1}#crowdc span{font:800 14px Rubik,system-ui;color:#3a2416;min-width:44px;text-align:center}
