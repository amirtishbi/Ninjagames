.card .h-heads .h-hd{flex:0 0 auto!important;width:clamp(30px,6.5vh,42px)!important;height:clamp(30px,6.5vh,42px)!important;min-height:0!important;padding:2px!important;margin:0!important;border-radius:12px!important;background:rgba(255,255,255,.06)!important;border:2px solid #3a3252!important;box-shadow:none!important;display:flex;align-items:center;justify-content:center;font:900 16px Rubik,system-ui;color:#c9a6ff}
.h-hd img{width:100%;height:100%;object-fit:contain;pointer-events:none}.card .h-heads .h-hd.sel{border-color:#ffb86b!important;background:rgba(255,184,107,.18)!important;transform:scale(1.1)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,2vw,16px);margin:4px 0 8px}
.podium .ps{display:flex;flex-direction:column;align-items:center;width:clamp(86px,22vw,130px)}
.podium .ps img{height:clamp(58px,15vh,112px);width:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}.podium .s0 img{height:clamp(70px,19vh,140px)}
.podium .ps b{font:800 13px Rubik,system-ui;color:#fff;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.podium .ps.me b{color:#ffb86b}
.podium .pt{font:900 15px Rubik,system-ui;color:#ffd27a;margin-bottom:3px}
.podium .step{width:100%;border:3px solid #07050c;border-bottom:0;border-radius:10px 10px 0 0;font:900 24px Rubik,system-ui;color:#3a2416;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.podium .s0 .step{height:clamp(44px,11vh,76px);background:linear-gradient(#ffe08a,#d39a1f)}.podium .s1 .step{height:clamp(32px,8vh,54px);background:linear-gradient(#eef0f6,#a7adbd)}.podium .s2 .step{height:clamp(24px,6vh,40px);background:linear-gradient(#f2b98a,#b0703c)}
.dr-f{height:clamp(56px,15vh,110px);display:flex;align-items:flex-end;justify-content:center}.dr-f img{height:100%;width:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}.dr-f.dn img{filter:grayscale(.6) brightness(.7)}.dr-f.up img{animation:podB .9s ease-in-out infinite alternate}
@keyframes podB{to{transform:translateY(-6px)}}
.pr-lv.rk{position:relative;width:34px!important;height:34px!important;background:none!important;border:0!important;line-height:0!important;flex:none;vertical-align:middle}.pr-lv.rk img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.pr-lv.rk i{position:absolute;right:-4px;bottom:-3px;font:900 10px/1 Rubik,system-ui;font-style:normal;background:#07050c;color:#ffd27a;border-radius:8px;padding:2px 4px}
.ch .chi{width:30px;height:30px;object-fit:contain;flex:none;margin-inline-end:6px;vertical-align:middle}.ch.done .chi{filter:grayscale(.2) brightness(1.1)}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 62%,rgba(10,6,30,.18) 86%,rgba(6,3,18,.32) 100%)}#vig.on{display:block}
#swp .sf img,#swp .sb img{max-width:200px;object-fit:contain}
/* ===== עור מאויר: לוחות קטיפה במסגרת זהב, כפתור צבוע, סרט לכותרות ===== */
#ov .card,#rules .rb,#dc .box{border:20px solid transparent!important;border-image:url(img/ui_panel.webp) 64 fill / 20px stretch!important;background:none!important;box-shadow:0 12px 30px rgba(0,0,0,.55)!important}
#ov .card.home{border-width:16px!important;border-image-width:16px!important}
#hpop{background:#2a1238!important}
.card button.now,#bootgo,#bAgain,#tuGo,#wcOk{border:14px solid transparent!important;border-image:url(img/ui_btn.webp) 80 fill / 14px stretch!important;background:none!important;box-shadow:0 6px 0 rgba(7,5,12,.55)!important;color:#fff8e8!important;text-shadow:0 2px 0 #7a2410,0 0 8px rgba(0,0,0,.35)!important}
#ov .card h2,#ov .card .endh,#rules .rb h2{display:table;margin:0 auto 8px;padding:8px 54px 16px;background:url(img/ui_ribbon.webp) center/100% 100% no-repeat;color:#fff3d6!important;text-shadow:0 2px 0 #5a0d16}
.h-ic,#snd,#quit{background:url(img/ui_ring.webp) center/112% 112% no-repeat,radial-gradient(circle,#3a2852 60%,transparent 61%)!important;border:0!important;box-shadow:none!important}
