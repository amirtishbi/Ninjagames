.card .h-heads .h-hd{flex:0 0 auto!important;width:clamp(30px,6.5vh,42px)!important;height:clamp(30px,6.5vh,42px)!important;min-height:0!important;padding:2px!important;margin:0!important;border-radius:12px!important;background:rgba(255,255,255,.06)!important;border:2px solid #3a3252!important;box-shadow:none!important;display:flex;align-items:center;justify-content:center;font:900 16px Rubik,system-ui;color:#c9a6ff}
.h-hd img{width:100%;height:100%;object-fit:contain;pointer-events:none}.card .h-heads .h-hd.sel{border-color:#ffb86b!important;background:rgba(255,184,107,.18)!important;transform:scale(1.1)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,2vw,16px);margin:4px 0 8px}
.podium .ps{display:flex;flex-direction:column;align-items:center;width:clamp(86px,22vw,130px)}
.podium .ps img{height:clamp(58px,15vh,112px);width:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}.podium .s0 img{height:clamp(70px,19vh,140px)}
.podium .ps b{font:800 13px Rubik,system-ui;color:#fff;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.podium .ps.me b{color:#ffb86b}
.podium .pt{font:900 15px Rubik,system-ui;color:#ffd27a;margin-bottom:3px}
.podium .step{width:100%;border:3px solid #07050c;border-bottom:0;border-radius:10px 10px 0 0;font:900 24px Rubik,system-ui;color:#3a2416;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 3px 0 rgba(255,255,255,.45)}
.podium .s0 .step{height:clamp(44px,11vh,76px);background:linear-gradient(#ffe08a,#d39a1f)}.podium .s1 .step{height:clamp(32px,8vh,54px);background:linear-gradient(#eef0f6,#a7adbd)}.podium .s2 .step{height:clamp(24px,6vh,40px);background:linear-gradient(#f2b98a,#b0703c)}
.dr-f{height:clamp(56px,15vh,110px);display:flex;align-items:flex-end;justify-content:center}.dr-f img{height:100%;width:auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}.dr-f.dn img{filter:grayscale(.6) brightness(.7)}.dr-f.up img{animation:podB .9s ease-in-out infinite alternate}
@keyframes podB{to{transform:translateY(-6px)}}
.pr-lv.rk{position:relative;width:34px!important;height:34px!important;background:none!important;border:0!important;line-height:0!important;flex:none;vertical-align:middle}.pr-lv.rk img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.pr-lv.rk i{position:absolute;right:-4px;bottom:-3px;font:900 10px/1 Rubik,system-ui;font-style:normal;background:#07050c;color:#ffd27a;border-radius:8px;padding:2px 4px}
.ch .chi{width:30px;height:30px;object-fit:contain;flex:none;margin-inline-end:6px;vertical-align:middle}.ch.done .chi{filter:grayscale(.2) brightness(1.1)}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 62%,rgba(10,6,30,.18) 86%,rgba(6,3,18,.32) 100%)}#vig.on{display:block}
#swp .sf img,#swp .sb img{max-width:200px;object-fit:contain}
/* ===== עור מאויר: לוחות קטיפה במסגרת זהב, כפתור צבוע, סרט לכותרות ===== */
#ov .card,#rules .rb,#dc .box{border:20px solid transparent!important;border-image:url(img/ui_panel.webp) 64 fill / 20px stretch!important;background:none!important;box-shadow:0 12px 30px rgba(0,0,0,.55)!important}
#ov .card.home{border-width:16px!important;border-image-width:16px!important}
#hpop{background:#2a1238!important}
.card button.now,#bootgo,#bAgain,#tuGo,#wcOk{border:14px solid transparent!important;border-image:url(img/ui_btn.webp) 80 fill / 14px stretch!important;background:none!important;box-shadow:0 6px 0 rgba(7,5,12,.55)!important;color:#fff8e8!important;text-shadow:0 2px 0 #7a2410,0 0 8px rgba(0,0,0,.35)!important}
#ov .card h2,#ov .card .endh,#rules .rb h2{display:table;margin:0 auto 8px;padding:8px 54px 16px;background:url(img/ui_ribbon.webp) center/100% 100% no-repeat;color:#fff3d6!important;text-shadow:0 2px 0 #5a0d16}
.h-ic,#snd,#quit{background:url(img/ui_ring.webp) center/112% 112% no-repeat,radial-gradient(circle,#3a2852 60%,transparent 61%)!important;border:0!important;box-shadow:none!important}
#swp .scd{width:min(380px,92vw)!important;height:min(200px,52vh)!important}
#swp .sf,#swp .sb{flex-direction:row!important;gap:10px;padding:10px 14px;border:4px solid #e9b949!important;box-shadow:0 0 0 3px #07050c,0 8px 0 #07050c,0 0 50px rgba(0,0,0,.6)!important}
#swp .sf{background:radial-gradient(circle at 30% 40%,#4a2a63,#2a1238)!important}
#swp .sbl{flex:0 0 42%;height:100%;display:flex;align-items:flex-end;justify-content:center}
#swp .sbl img{height:92%!important;max-height:170px;width:auto;max-width:100%!important;margin:0!important;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(7,5,12,.7))}
#swp .sbr{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;text-align:start}
#swp .st{font:900 clamp(18px,4.2vh,24px)/1.1 Rubik,system-ui!important;margin:0!important;color:#fff;text-shadow:0 2px 0 #07050c}
#swp .goal{display:flex;align-items:center;gap:8px;font:800 16px Rubik,system-ui;color:#ffe9b8}
#swp .goal em{font-style:normal}
#swp .goal .tg{height:40px;width:40px;object-fit:contain;border-radius:50%;background:rgba(7,5,12,.35);border:2px solid #ffe9b8;margin:0!important;filter:none!important}
#swp .pw{display:flex;gap:10px}
#swp .pw i{display:flex;flex-direction:column;align-items:center;font:800 11px Rubik,system-ui;font-style:normal;color:#fff;gap:2px}
#swp .pw img{height:38px!important;width:38px;margin:0!important;filter:drop-shadow(0 2px 0 rgba(7,5,12,.6))!important}
#swp .sf b.q{font-size:96px}#swp .sf .st{margin-top:6px!important}
#swp .ssub{top:calc(50% + 120px)!important}
img.ei{height:1.25em;width:auto;vertical-align:-.28em;margin-inline-end:.18em;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
/* כרטיס מוות + חוקים: אותו עור כמו כרטיס התפקיד */
#dc .box{border:4px solid #e9b949!important;border-radius:18px!important;background:radial-gradient(circle at 50% 30%,#3a1a4e,#1a0c26)!important;box-shadow:0 0 0 3px #07050c,0 10px 0 #07050c,0 0 50px rgba(0,0,0,.6)!important;border-image:none!important}
#dc .box h3{display:table;margin:-2px auto 8px;padding:6px 40px 12px;background:url(img/ui_ribbon.webp) center/100% 100% no-repeat;color:#fff3d6;text-shadow:0 2px 0 #5a0d16}
#rules .rb{border:4px solid #e9b949!important;border-radius:18px!important;background:radial-gradient(circle at 50% 30%,#3a1a4e,#1a0c26)!important;box-shadow:0 0 0 3px #07050c,0 10px 0 #07050c,0 0 50px rgba(0,0,0,.6)!important;border-image:none!important}
#rules .rb ul{list-style:none;padding:0;margin:6px 0 10px}#rules .rb li{display:flex;align-items:center;gap:8px;padding:5px 0;font:700 16px Rubik,system-ui;color:#fff}
#rules .rb li img.ei{height:30px;vertical-align:middle}
[data-tag="h"]::after,[data-tag="p"]::after{content:''!important;background:url(img/ui_h.webp) center/74% no-repeat,#0b0912!important}[data-tag="p"]::after{background:url(img/ui_p.webp) center/74% no-repeat,#0b0912!important}
#moon{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}#moon.up,#moon.down{display:block}
#moon .mtint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(150,190,255,.18),rgba(20,30,70,.28) 70%);opacity:0;transition:opacity 1.2s}
#moon.up .mtint{opacity:1}
#moon img{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 6px);width:clamp(70px,20vh,130px);transform:translate(-50%,120%) scale(.6);opacity:0;filter:drop-shadow(0 0 22px rgba(190,220,255,.85));transition:transform 1.8s cubic-bezier(.2,.8,.25,1),opacity 1.2s}
#moon.up img{transform:translate(-50%,40%) scale(1);opacity:1}#moon.down img{transform:translate(-50%,-140%) scale(.8);opacity:0;transition:transform 1.2s ease-in,opacity 1s}
#moon .mtx{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + clamp(70px,20vh,130px)*1.55 + 12px);transform:translateX(-50%);text-align:center;white-space:nowrap;opacity:0;transition:opacity .6s .6s}
#moon.up .mtx{opacity:1}#moon.up.on .mtx{opacity:0;transition-delay:2.2s}
#moon .mtx b{display:block;font:900 clamp(26px,6vh,40px) Rubik,system-ui;color:#eaf4ff;text-shadow:0 3px 0 #07050c,0 0 16px rgba(160,200,255,.8)}
#moon .mtx span{font:800 clamp(14px,3vh,18px) Rubik,system-ui;color:#cfe3ff;text-shadow:0 2px 0 #07050c}
