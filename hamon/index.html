body.home .btn,body.home #hud,body.home #fl,body.home #ti{display:none!important}

#ti.on{display:flex;animation:tiIn .45s cubic-bezier(.2,1.5,.4,1) both,tiOut .55s ease-in 2.3s forwards}
#ti small{font-size:13px;color:#2f8a84;letter-spacing:.5px}#ti b{font-size:24px;color:#8e2c3e}#ti i{font-style:normal;font-size:13px;color:#6b4a33}
#ti img{height:min(30vh,150px);filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 10px rgba(86,192,70,.9));animation:tiBob .6s ease-in-out infinite alternate}

@keyframes tiOut{to{transform:translate(calc(50vw - 110px),calc(-50vh + 60px)) scale(.25);opacity:0;box-shadow:0 6px 0 #3a2416,0 0 0 9999px rgba(18,20,38,0)}}
@keyframes tiBob{to{transform:translateY(-6px)}}
body.home #ov{background:#f3e7cd;padding:0;align-items:stretch;justify-content:stretch}

body.home .h-play{justify-content:center}body.home .h-play h1{font-size:min(clamp(28px,6vh,52px),10vw)}

.card.home{max-width:900px;padding:10px 16px 12px;position:relative}
.h-top{display:flex;align-items:center;gap:8px}
.h-rank{display:flex;align-items:center;gap:7px;flex:1;min-width:0;font-size:14px}.h-rank b{color:#8e2c3e;white-space:nowrap}.h-rank .pr-bar{flex:1;max-width:150px;margin:0}.h-rank .pr-xp{white-space:nowrap}
.card .h-ic{width:40px;height:40px;padding:0;margin:0;font-size:18px;background:#fff8e8;color:#3a2416;position:relative;flex:none;line-height:1}
.h-ic i{position:absolute;top:-7px;left:-7px;font:800 10px Rubik,system-ui;font-style:normal;background:#2f8a84;color:#fff;border:2px solid #3a2416;border-radius:9px;padding:1px 4px}
.h-body{display:flex;gap:14px;margin-top:8px;align-items:stretch}
.h-char{flex:0 0 230px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#fff8e8;border:2.5px solid #3a2416;border-radius:14px;padding:8px 8px 10px}
.h-stage{display:flex;align-items:center;justify-content:space-between;width:100%}.h-stage img{height:118px;filter:drop-shadow(0 4px 0 rgba(58,36,22,.18))}.h-stage .q{font:800 64px Rubik,system-ui;color:#8e2c3e;height:118px;line-height:118px}
.card .h-arr{width:34px;height:34px;padding:0;margin:0;border-radius:50%;font-size:18px;line-height:1;background:#f3e7cd;color:#3a2416;box-shadow:0 3px 0 #3a2416}
.h-cn{font-weight:800;color:#8e2c3e;font-size:15px}
.h-dots{display:flex;gap:7px;justify-content:center}.card .h-dot{width:22px;height:22px;padding:0;margin:0;border-radius:50%;border-width:2px;box-shadow:none;font-size:10px;line-height:1}
.card .h-dot.sel{outline:3px solid #eab84e;outline-offset:2px}.card .h-dot.lock{opacity:.4}
.h-char input{margin:2px 0 0;width:100%;text-align:center;padding:8px;font-size:15px}
.h-play{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.h-play h1{font-size:30px;margin:0;line-height:1.1}.h-play .sub{margin:0 0 2px}
.h-play .row2 button{margin:0;padding:11px 6px;font-size:15.5px}
.card .h-play .row2 button.sm{padding:8px 6px;font-size:14px}
.onl{background:#fff8e8;border:2.5px solid #3a2416;border-radius:12px;padding:5px 10px 6px;flex:1;min-height:64px;display:flex;flex-direction:column}
.onl-h{font-size:12.5px;font-weight:800;color:#6b4a33;display:flex;align-items:center;gap:6px}.onl-h .lv{width:8px;height:8px;border-radius:50%;background:#2fa36b;box-shadow:0 0 0 3px rgba(47,163,107,.25)}
.onl-l{overflow:auto;max-height:104px;margin-top:2px}.onl-e{font-size:13px;color:#8a6a4a;padding:6px 0;text-align:center}
.onr{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1.5px solid rgba(58,36,22,.12)}.onr:last-child{border:0}
.onr img{height:30px;width:24px;object-fit:contain}.onr b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.onr small{color:#8a6a4a;font-size:11.5px}
.card .onr button{width:auto;padding:5px 10px;margin:0;font-size:12.5px;box-shadow:0 2px 0 #3a2416;border-width:2px}
#hpop{position:absolute;inset:0;background:#f3e7cd;border-radius:13px;padding:12px 16px;overflow:auto;z-index:3;display:none}#hpop.on{display:block}
#hpop .x{position:sticky;top:0;float:left;width:36px;height:36px;padding:0;margin:0;font-size:18px;background:#fff8e8;color:#3a2416}
#req{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-160%);z-index:30;background:#f3e7cd;color:#3a2416;border:3px solid #3a2416;border-radius:14px;box-shadow:0 5px 0 #3a2416;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;transition:transform .3s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
